<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Research Studies | Stanford Psychology</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Source Sans Pro', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      max-width: 900px;
      width: 100%;
      padding: 60px;
    }

    h1 {
      color: #2d3748;
      font-size: 2.5rem;
      margin-bottom: 48px;
      font-weight: 600;
      text-align: center;
      letter-spacing: -0.5px;
    }

    .experiment-list {
      list-style: none;
    }

    .experiment-item {
      margin-bottom: 16px;
    }

    .experiment-link {
      display: block;
      padding: 28px 32px;
      background: #ffffff;
      color: #2d3748;
      text-decoration: none;
      border-radius: 6px;
      font-size: 1.3rem;
      font-weight: 500;
      transition: all 0.2s ease;
      border: 1.5px solid #e0e0e0;
    }

    .experiment-link:hover {
      border-color: #8C1515;
      box-shadow: 0 2px 12px rgba(140, 21, 21, 0.12);
    }

    .experiment-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #8C1515;
    }

    .experiment-title::before {
      content: '→';
      font-size: 1.5rem;
      transition: transform 0.2s ease;
    }

    .experiment-link:hover .experiment-title::before {
      transform: translateX(4px);
    }

    .experiment-description {
      display: block;
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 8px;
      color: #718096;
      line-height: 1.5;
      margin-left: 32px;
    }

    .footer {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
    }

    .footer a {
      color: #8C1515;
      text-decoration: none;
      font-weight: 500;
      transition: opacity 0.2s ease;
    }

    .footer a:hover {
      opacity: 0.7;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .container {
        padding: 40px 30px;
      }

      h1 {
        font-size: 2rem;
      }

      .experiment-link {
        padding: 24px;
        font-size: 1.15rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Research Studies</h1>

    <ul class="experiment-list">
      <li class="experiment-item">
        <a href="experiments/pilot_A/index.html" class="experiment-link">
          <div class="experiment-title">Pilot A Study</div>
          <span class="experiment-description">
            A study about perceived complexity
          </span>
        </a>
      </li>

      <li class="experiment-item">
        <a href="experiments/example-experiment/index.html" class="experiment-link">
          <div class="experiment-title">Example Experiment</div>
          <span class="experiment-description">
            A demo experiment showing jsPsych features
          </span>
        </a>
      </li>
    </ul>
  </div>
</body>
</html>
