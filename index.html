<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jsPsych Experiments</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-width: 800px;
      width: 100%;
      padding: 48px;
    }

    h1 {
      color: #2d3748;
      font-size: 2.5rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .subtitle {
      color: #718096;
      font-size: 1.1rem;
      margin-bottom: 40px;
    }

    .experiment-list {
      list-style: none;
    }

    .experiment-item {
      margin-bottom: 16px;
      transition: transform 0.2s ease;
    }

    .experiment-item:hover {
      transform: translateX(8px);
    }

    .experiment-link {
      display: block;
      padding: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.25rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .experiment-link:hover {
      box-shadow: 0 8px 24px rgba(102, 126, 234, 0.6);
      transform: translateY(-2px);
    }

    .experiment-description {
      display: block;
      font-size: 0.95rem;
      font-weight: 400;
      margin-top: 8px;
      opacity: 0.9;
    }

    .footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 2px solid #e2e8f0;
      text-align: center;
      color: #718096;
      font-size: 0.9rem;
    }

    .footer a {
      color: #667eea;
      text-decoration: none;
      font-weight: 600;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>jsPsych Experiments</h1>
    <p class="subtitle">Select an experiment to participate</p>

    <ul class="experiment-list">
      <li class="experiment-item">
        <a href="experiments/threa4-study/index.html" class="experiment-link">
          Threa-4 Research Study
          <span class="experiment-description">
            A study about perceived complexity in biological systems
          </span>
        </a>
      </li>

      <li class="experiment-item">
        <a href="experiments/example-experiment/index.html" class="experiment-link">
          Example Experiment
          <span class="experiment-description">
            A demo experiment showing jsPsych features
          </span>
        </a>
      </li>
    </ul>

    <div class="footer">
      <p>
        Built with <a href="https://www.jspsych.org/" target="_blank">jsPsych</a> &bull;
        Data collected via <a href="https://pipe.jspsych.org/" target="_blank">DataPipe</a>
      </p>
    </div>
  </div>
</body>
</html>
