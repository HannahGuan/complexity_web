<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Threa-4 Research Study</title>

  <!-- jsPsych core -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>

  <!-- DataPipe plugin for data collection -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

  <style>
    body {
      background-color: #ffffff;
    }
    .study-info {
      max-width: 800px;
      margin: 0 auto;
      text-align: left;
      line-height: 1.6;
      font-size: 16px;
    }
    .study-info h2 {
      color: #2c3e50;
      margin-top: 30px;
      margin-bottom: 15px;
    }
    .study-info p {
      margin-bottom: 15px;
    }
    .question-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }
    .question-item {
      margin-bottom: 30px;
    }
    .question-item label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 16px;
    }
    .likert-scale {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
    }
    .likert-option input[type="radio"] {
      margin-bottom: 5px;
    }
    .likert-label {
      font-size: 12px;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .submit-container {
      text-align: center;
      margin-top: 40px;
    }
    .submit-btn {
      background-color: #3498db;
      color: white;
      padding: 12px 30px;
      font-size: 16px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .submit-btn:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body></body>

<script>
  // Initialize jsPsych
  const jsPsych = initJsPsych({
    on_finish: function() {
      // Display completion message
      document.body.innerHTML = `
        <div style="max-width: 800px; margin: 100px auto; text-align: center;">
          <h1>Thank you for participating!</h1>
          <p>Your responses have been saved.</p>
          <p>You may close this window now.</p>
        </div>
      `;
    }
  });

  // Generate unique participant ID using jsPsych's randomization
  const subject_id = jsPsych.randomization.randomID(10);
  const filename = `${subject_id}.csv`;

  // Timeline array to hold all trials
  let timeline = [];

  // Combined page with study information and all questions
  const combinedPage = {
    type: jsPsychSurveyHtmlForm,
    preamble: `
      <div class="study-info">
        <h2>About this study</h2>
        <p>A moon called Threa-4 has recently attracted interest as a transfer hub for future space exploration. A permanent residence is being planned there.</p>

        <p>The engineering team is trying to build compact heating units deployed to individual field outposts, where each unit's heat output directly determines whether that outpost stays warm, so it is important that the heat is provided in time on the cold days.</p>

        <p>Coincidentally, Threa-4 is also one of the few known astronomical objects where xenobiological species — forms of non-Earth life — have been discovered. Xenobiologists have been researching them for a decade.</p>

        <h2>Threa-4 biology: current scientific understanding</h2>
        <p>Because Threa-4 is a relatively barren moon made up of very few distinct elements, the organisms that evolved there have turned out to be pretty simple in terms of physiology and behavior.</p>

        <p>The simple organism's physiology depends on a small number of environmental factors in a predictable way, all of which can be directly measured. The relevant variables do not interact in complicated ways, and identical conditions reliably produce nearly identical physiological responses.</p>
      </div>
    `,
    html: `
      <div class="question-section">
        <div class="question-item">
          <label>How complex do you perceive the Threa-4 biological system to be?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="1" required>
              <span class="likert-label">1<br>Not at all<br>complex</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="4" required>
              <span class="likert-label">4<br>Moderately<br>complex</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity" value="7" required>
              <span class="likert-label">7<br>Extremely<br>complex</span>
            </div>
          </div>
          <textarea name="complexity_justification" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>

        <div class="question-item">
          <label>How competent do you think the xenobiology research team is?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="team_competence" value="1" required>
              <span class="likert-label">1<br>Not at all<br>competent</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="4" required>
              <span class="likert-label">4<br>Moderately<br>competent</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence" value="7" required>
              <span class="likert-label">7<br>Extremely<br>competent</span>
            </div>
          </div>
          <textarea name="competence_justification" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>

        <div class="question-item">
          <label>How honest do you think the xenobiology research team is?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="1" required>
              <span class="likert-label">1<br>Not at all<br>honest</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="4" required>
              <span class="likert-label">4<br>Moderately<br>honest</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty" value="7" required>
              <span class="likert-label">7<br>Extremely<br>honest</span>
            </div>
          </div>
          <textarea name="honesty_justification" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>
      </div>
    `,
    button_label: 'Continue',
    data: {
      task: 'main_questionnaire'
    }
  };
  timeline.push(combinedPage);

  // Open-ended questions page
  const openEndedQuestions = {
    type: jsPsychSurveyText,
    preamble: '<p style="font-size: 18px; margin-bottom: 30px;"><strong>Please answer the following questions:</strong></p>',
    questions: [
      {
        prompt: 'Would you expect the expert in this domain to revise their understanding over the next year? If so, what kind of revisions would you expect them to make?',
        rows: 6,
        columns: 80,
        required: true,
        name: 'expert_revision_expectation'
      },
      {
        prompt: 'If the expert provides more detailed information afterwards, why do you think they make this decision?',
        rows: 6,
        columns: 80,
        required: true,
        name: 'detailed_info_reasoning'
      }
    ],
    button_label: 'Continue',
    data: {
      task: 'open_ended_questions'
    }
  };
  timeline.push(openEndedQuestions);

  // Manipulation check: Likelihood of revision (percentage)
  const revisionLikelihood = {
    type: jsPsychSurveyHtmlForm,
    preamble: '<p style="font-size: 18px; margin-bottom: 20px;"><strong>Manipulation Check Questions</strong></p>',
    html: `
      <div style="max-width: 800px; margin: 0 auto;">
        <label style="display: block; font-weight: bold; margin-bottom: 10px; font-size: 16px;">
          What is the likelihood (in percentage) that the research team will revise their understanding over the next year?
        </label>
        <input type="number" name="revision_likelihood" min="0" max="100" step="1" required
               style="width: 150px; padding: 8px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px;">
        <span style="margin-left: 10px; font-size: 16px;">%</span>
        <p style="font-size: 14px; color: #666; margin-top: 5px;">Please enter a number between 0 and 100</p>
      </div>
    `,
    button_label: 'Continue',
    data: {
      task: 'revision_likelihood'
    }
  };
  timeline.push(revisionLikelihood);

  // Manipulation check: Reasons for revision
  const revisionReasons = {
    type: jsPsychSurveyLikert,
    preamble: `
      <p style="font-size: 18px; margin-bottom: 20px;"><strong>If the research team makes revisions afterwards, how likely is each of the following reasons?</strong></p>
    `,
    questions: [
      {
        prompt: "They discovered more relevant factors that affect the organisms",
        labels: [
          "1<br>Very unlikely",
          "2",
          "3",
          "4<br>Moderately likely",
          "5",
          "6",
          "7<br>Very likely"
        ],
        required: true,
        name: 'revision_reason_more_factors'
      },
      {
        prompt: "They found the relationships between variables are more dynamic than initially thought",
        labels: [
          "1<br>Very unlikely",
          "2",
          "3",
          "4<br>Moderately likely",
          "5",
          "6",
          "7<br>Very likely"
        ],
        required: true,
        name: 'revision_reason_dynamic_relationships'
      },
      {
        prompt: "Their original idea was wrong",
        labels: [
          "1<br>Very unlikely",
          "2",
          "3",
          "4<br>Moderately likely",
          "5",
          "6",
          "7<br>Very likely"
        ],
        required: true,
        name: 'revision_reason_original_wrong'
      }
    ],
    button_label: 'Continue',
    data: {
      task: 'revision_reasons'
    }
  };
  timeline.push(revisionReasons);

  // New information page with follow-up questionnaire
  const followUpPage = {
    type: jsPsychSurveyHtmlForm,
    preamble: `
      <div class="study-info">
        <p>As part of the planning process, a team led by Dr. Aren, a xenobiologist who studies a bacteria-like species called Zorblax, proposed that managed Zorblax colonies could be used as low-maintenance heat sources.</p>

        <p>In the proposal submitted by Dr. Aren's team, they explained that:</p>

        <p><em>"Zorblax is a tiny special organism about the same size as a bacteria on earth. They generate heat by absorbing a specific airborne compound we call threane through their respiratory surfaces. Threane is naturally present in Threa-4's atmosphere, and it's temperature-sensitive: it's abundant in cold air and dissipates rapidly as temperatures rise. So when ambient temperature drops, there's more threane available, Zorblax absorb more of it, and their heat output rises proportionally. Colder environment, more threane uptake, more heat output."</em></p>

        <p>Following the proposal, a pilot Zorblax heating colony was designed by the engineer team and heat output is being monitored. During the first cold-weather trial, engineers found that Zorblax heat output was not consistently higher on colder days. On several of the coldest days, the colony produced less heat than it had on nearby cooler days.</p>

        <p>Regarding this Dr. Aren replied:</p>

        <p><em>"Even though colder periods increase heat output on average, a colony can sometimes produce less heat on a very cold day because Zorblax regulate heat in cycles and synchronize with each other in dense colonies. After a period of high heat production on fairly cold days, many individuals enter a temporary recovery phase in which their heat output drops."</em></p>
      </div>
    `,
    html: `
      <div class="question-section">
        <div class="question-item">
          <label>How complex do you perceive the Threa-4 biological system to be?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="1" required>
              <span class="likert-label">1<br>Not at all<br>complex</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="4" required>
              <span class="likert-label">4<br>Moderately<br>complex</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="perceived_complexity_followup" value="7" required>
              <span class="likert-label">7<br>Extremely<br>complex</span>
            </div>
          </div>
          <textarea name="complexity_justification_followup" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>

        <div class="question-item">
          <label>How competent do you think the xenobiology research team is?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="1" required>
              <span class="likert-label">1<br>Not at all<br>competent</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="4" required>
              <span class="likert-label">4<br>Moderately<br>competent</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_competence_followup" value="7" required>
              <span class="likert-label">7<br>Extremely<br>competent</span>
            </div>
          </div>
          <textarea name="competence_justification_followup" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>

        <div class="question-item">
          <label>How honest do you think the xenobiology research team is?</label>
          <div class="likert-scale">
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="1" required>
              <span class="likert-label">1<br>Not at all<br>honest</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="2" required>
              <span class="likert-label">2</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="3" required>
              <span class="likert-label">3</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="4" required>
              <span class="likert-label">4<br>Moderately<br>honest</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="5" required>
              <span class="likert-label">5</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="6" required>
              <span class="likert-label">6</span>
            </div>
            <div class="likert-option">
              <input type="radio" name="team_honesty_followup" value="7" required>
              <span class="likert-label">7<br>Extremely<br>honest</span>
            </div>
          </div>
          <textarea name="honesty_justification_followup" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
        </div>
      </div>
    `,
    button_label: 'Submit',
    data: {
      task: 'followup_questionnaire'
    }
  };
  timeline.push(followUpPage);

  // Save data to DataPipe
  const save_data = {
    type: jsPsychPipe,
    action: "save",
    experiment_id: "uNrh6jZkRoPw",
    filename: filename,
    data_string: () => jsPsych.data.get().csv()
  };
  timeline.push(save_data);

  // Run the experiment
  jsPsych.run(timeline);
</script>

</html>
