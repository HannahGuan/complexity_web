<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Research Study</title>

  <!-- jsPsych core -->
  <script src="https://unpkg.com/jspsych@7.3.4"></script>
  <link href="https://unpkg.com/jspsych@7.3.4/css/jspsych.css" rel="stylesheet" type="text/css" />

  <!-- jsPsych plugins -->
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form@1.0.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.2.0"></script>

  <!-- DataPipe plugin for data collection -->
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

  <!-- Vignette definitions, generated from vignettes/*.csv by build_vignettes.py -->
  <script src="vignettes.js"></script>

  <style>
    /* One place to retune how much of the window the study uses. Prose keeps a
       measure that is still comfortable to read; the rating grids, which only
       get easier to use as they widen, are allowed to run wider. */
    :root {
      --read-width: min(1080px, 92vw);
      --wide-width: min(1280px, 95vw);
      --base-font: 19px;
    }

    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background-color: #ffffff;
      font-size: var(--base-font);
      /* Discourage copying the vignette out of the study. Participants still
         need to select inside their own answers, so the fields opt back in. */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    textarea, input {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    /* Shown whenever the window leaves fullscreen mid-study. Re-entering
       fullscreen needs a user gesture, so this has to be a button. */
    #fullscreen-nag {
      position: fixed;
      inset: 0;
      z-index: 100000;
      background: #ffffff;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    #fullscreen-nag.visible {
      display: flex;
    }

    #fullscreen-nag p {
      max-width: 560px;
      font-size: 21px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* jsPsych centres its content in a 95%-of-800px column by default, which
       leaves most of a modern display empty. Let the wrapper use the whole
       window and let each container below set its own width. */
    .jspsych-display-element {
      width: 100%;
      min-height: 100vh;
      font-size: var(--base-font);
    }

    .jspsych-content-wrapper {
      width: 100%;
      align-items: flex-start;
    }

    .jspsych-content {
      max-width: 100%;
      width: 100%;
      padding: 40px 24px 64px;
      box-sizing: border-box;
      /* jsPsych uses margin:auto here to stand short trials in the middle of
         the page. With long reading screens that makes the text jump between
         trials, so pin everything to the top instead. */
      margin: 0 auto;
    }

    /* Main content container */
    .study-info {
      max-width: var(--read-width);
      margin: 0 auto;
      text-align: left;
      line-height: 1.7;
      font-size: var(--base-font);
    }

    .study-info h2 {
      color: #2c3e50;
      margin-top: 34px;
      margin-bottom: 16px;
      font-size: 25px;
      font-weight: 600;
    }

    .study-info p {
      margin-bottom: 15px;
    }

    .study-info.wide {
      max-width: var(--wide-width);
    }

    /* Briefing card - callout box style */
    .briefing-card {
      background-color: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 24px 28px;
      margin: 28px 0;
    }

    .briefing-card h2 {
      margin-top: 0;
      color: #2c3e50;
      font-size: 22px;
    }

    /* Highlight for re-reading sections */
    .highlight-reread {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 20px 24px;
      margin: 20px 0;
      border-radius: 4px;
    }

    /* Question sections */
    .question-section {
      max-width: var(--wide-width);
      margin: 40px auto 0;
      text-align: left;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }

    .question-item {
      margin-bottom: 52px;
    }

    .question-item label {
      display: block;
      font-weight: bold;
      margin-bottom: 18px;
      font-size: 21px;
    }

    /* Comprehension check questions */
    .comprehension-question {
      max-width: var(--read-width);
      margin: 0 auto 25px;
      padding: 24px 28px;
      background-color: #f8f9fa;
      border-radius: 6px;
    }

    .comprehension-question label {
      font-weight: 600;
      margin-bottom: 12px;
      display: block;
    }

    .comprehension-question input[type="radio"] {
      width: 26px;
      height: 26px;
      margin-right: 14px;
      accent-color: #3498db;
      cursor: pointer;
      flex: none;
    }

    .comprehension-option {
      margin: 10px 0;
      padding: 2px;
      font-size: 19px;
    }

    .comprehension-option label:hover {
      background-color: #eef4fa;
    }

    .comprehension-feedback {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-weight: 500;
    }

    .comprehension-feedback.incorrect {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
    }

    /* Likert scale */
    .likert-scale {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 6px;
      margin: 18px 0 14px;
    }

    /* The whole column is a <label>, so the number and the anchor text are
       part of the click target, not just the circle. */
    .likert-option {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      padding: 10px 4px;
      border-radius: 6px;
      cursor: pointer;
    }

    .likert-option:hover {
      background-color: #eef4fa;
    }

    .likert-option input[type="radio"] {
      width: 32px;
      height: 32px;
      margin: 0 0 12px;
      accent-color: #3498db;
      cursor: pointer;
    }

    .likert-label {
      font-size: 17px;
      line-height: 1.4;
      text-align: center;
    }

    /* Decorative illustrations at the top of Screen 1a and Screen 2. Purely
       scene-setting, so they carry no caption. The source images are square
       (1254x1254); left at the column's full width they would fill the viewport
       and push the text below the fold, hence the height cap. */
    .scene-aid {
      margin: 8px 0 30px;
      text-align: center;
    }

    .scene-aid img {
      max-width: 100%;
      max-height: 280px;
      width: auto;
      height: auto;
    }

    /* Visual aid - sits directly above the passage it illustrates */
    .visual-aid {
      margin: 22px 0 26px;
      text-align: center;
    }

    .visual-aid img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .visual-aid figcaption {
      margin-top: 12px;
      font-size: 17px;
      color: #666;
    }

    /* Framing note - set off by a rule and a tint, not by a different font */
    .context-note {
      background-color: #f8f9fa;
      border-left: 4px solid #3498db;
      padding: 18px 24px;
      margin: 20px 0 26px;
      border-radius: 4px;
    }

    .context-note p {
      margin: 0;
    }

    /* Text areas */
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-family: Arial, sans-serif;
      font-size: 18px;
      border: 1px solid #ccc;
      border-radius: 4px;
      line-height: 1.5;
    }

    /* Buttons */
    .submit-container {
      text-align: center;
      margin-top: 40px;
    }

    .submit-btn, .jspsych-btn {
      background-color: #3498db;
      color: white;
      padding: 14px 40px;
      font-size: 19px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .submit-btn:hover, .jspsych-btn:hover {
      background-color: #2980b9;
    }

    /* Reading screen specific */
    .reading-screen {
      max-width: var(--read-width);
      margin: 0 auto;
      text-align: left;
      padding: 8px 0 20px;
      line-height: 1.75;
      font-size: var(--base-font);
    }

    .reading-screen h1 {
      font-size: 34px;
      text-align: center;
    }

    .reading-screen h2 {
      color: #2c3e50;
      font-size: 25px;
      margin-bottom: 16px;
    }

    .continue-button-container {
      text-align: center;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div id="fullscreen-nag">
    <p>This study must be completed in fullscreen mode. Please return to
    fullscreen to continue.</p>
    <button class="jspsych-btn" id="fullscreen-nag-btn">Return to fullscreen</button>
  </div>
</body>

<script>
  // ===== COPY / PASTE BLOCKING =====
  // Keeps the vignette from being lifted out of the study (e.g. into an LLM)
  // and keeps free-text answers from being pasted in. Typing is untouched, so
  // participants can still write and edit their own responses.
  ['copy', 'cut', 'paste', 'dragstart', 'contextmenu'].forEach(function(evt) {
    document.addEventListener(evt, function(e) { e.preventDefault(); });
  });
  document.addEventListener('keydown', function(e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    const key = e.key.toLowerCase();
    if (['c', 'x', 'v'].indexOf(key) !== -1) {
      e.preventDefault();
    } else if (key === 'a' && !/^(TEXTAREA|INPUT)$/.test(e.target.tagName)) {
      // Select-all inside a participant's own answer field is just editing.
      e.preventDefault();
    }
  });

  // Initialize jsPsych
  const jsPsych = initJsPsych({
    on_finish: function() {
      if (new URLSearchParams(window.location.search).get('test') === '1') {
        // Test mode: show the data that WOULD have been saved, for inspection.
        document.body.innerHTML = `
          <div style="max-width: 1000px; margin: 40px auto; padding: 0 20px;">
            <h1 style="color:#856404;">Test run complete - nothing was saved</h1>
            <p>Below is the data this run would have submitted.</p>
            <p><button class="jspsych-btn" onclick="navigator.clipboard.writeText(
                 document.getElementById('test-csv').textContent)">Copy CSV</button></p>
            <pre id="test-csv" style="text-align:left;font-size:11px;overflow:auto;
                 max-height:60vh;background:#f8f9fa;border:1px solid #dee2e6;
                 padding:12px;border-radius:4px;"></pre>
          </div>
        `;
        document.getElementById('test-csv').textContent = jsPsych.data.get().csv();
        return;
      }
      // Display completion message
      document.body.innerHTML = `
        <div style="max-width: 800px; margin: 100px auto; text-align: center;">
          <h1>Thank you for participating!</h1>
          <p>Your responses have been saved.</p>
          <p>You may close this window now.</p>
        </div>
      `;
    }
  });

  // Generate unique participant ID using jsPsych's randomization
  const subject_id = jsPsych.randomization.randomID(10);
  const filename = `${subject_id}.csv`;

  // ===== RANDOM ASSIGNMENT =====
  // Design: 24 vignettes (6 scenarios x 2 relevance types x 2 revision types,
  // from vignettes/text.csv) fully crossed with complexity (simple / complex)
  // and relevance (relevant / irrelevant) = 96 cells. Vignette, complexity and
  // relevance are drawn independently and uniformly at random per participant.
  // Relevance type and revision type are between subjects: they ride along on
  // whichever vignette row is drawn, and because the rows are fully crossed a
  // uniform draw leaves both balanced.
  if (!window.VIGNETTES || !window.VIGNETTES.length) {
    document.body.innerHTML = `
      <div style="max-width: 640px; margin: 100px auto; text-align: center;">
        <h2>Setup error</h2>
        <p>The vignette definitions could not be loaded.</p>
        <p style="color:#666; font-size:14px;">vignettes.js is missing or empty.
        Run <code>python3 build_vignettes.py</code> to regenerate it.</p>
      </div>`;
    throw new Error('vignettes.js did not define window.VIGNETTES');
  }

  function pickOne(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // ===== TEST MODE (local piloting only) =====
  // ?test=1             run without saving to DataPipe; dump the data on screen
  // ?vignette=12        force a specific vignette index (0-23)
  // ?complexity=simple  force the complexity arm
  // ?relevance=relevant force the relevance arm
  // With no query string this behaves exactly as the live study does.
  const params = new URLSearchParams(window.location.search);
  const TEST_MODE = params.get('test') === '1';

  function forced(name, allowed) {
    const v = params.get(name);
    if (v === null) return null;
    if (allowed.indexOf(v) === -1) {
      throw new Error('Invalid ?' + name + '=' + v + ' (expected one of: ' + allowed.join(', ') + ')');
    }
    return v;
  }

  const forcedVignette = params.get('vignette');
  const vignette = forcedVignette !== null
    ? window.VIGNETTES.find(function(v) { return String(v.index) === forcedVignette; })
    : pickOne(window.VIGNETTES);
  if (!vignette) {
    throw new Error('Invalid ?vignette=' + forcedVignette + ' (expected 0-' +
                    (window.VIGNETTES.length - 1) + ')');
  }
  const complexity = forced('complexity', ['simple', 'complex']) || pickOne(['simple', 'complex']);
  const relevance = forced('relevance', ['relevant', 'irrelevant']) || pickOne(['relevant', 'irrelevant']);
  const condition = complexity + '_' + relevance;

  // Add condition info to all data collected
  jsPsych.data.addProperties({
    subject_id: subject_id,
    condition: condition,
    complexity: complexity,
    relevance: relevance,
    vignette_index: vignette.index,
    vignette_category: vignette.category,
    relev_typ: vignette.relev_typ,
    rev_typ: vignette.rev_typ,
    test_mode: TEST_MODE
  });

  // ===== TEXT RENDERING =====
  // Paragraphs come from the CSVs as plain text and are all rendered in the
  // same face and weight. Quoted speech used to be italicised and lead-ins
  // bolded; pilot readers skipped the italics, which is exactly where the
  // mechanism they are later questioned about lives. Quotation marks alone
  // now mark who is speaking.
  function renderParagraphs(paras) {
    return paras.map(function(p) {
      return '<p>' + p + '</p>';
    }).join('\n');
  }

  // Condition-specific passages for this participant's vignette
  const decisionContextHtml = renderParagraphs(vignette.decision[relevance]);
  const complexityBriefingHtml =
    `<h2>${vignette.briefing_heading}</h2>\n` +
    renderParagraphs(vignette.complexity[complexity]);
  const anomalyHtml = renderParagraphs(vignette.anomaly);
  const justificationHtml = renderParagraphs(vignette.justification);

  // Decorative illustrations: the scene-setter on Screen 1a and the field /
  // lab scene that accompanies the new evidence on Screen 2. Both only set the
  // scene - neither depicts anything participants are questioned about - so alt
  // is empty and there is no caption, and screen readers skip them.
  function decorativeAidHtml(path) {
    return path ? `
        <div class="scene-aid">
          <img src="${path}" alt="">
        </div>` : '';
  }
  const sceneAidHtml = decorativeAidHtml(vignette.scene_aid);
  const evidenceAidHtml = decorativeAidHtml(vignette.evidence_aid);

  // Visual aid for this scenario (tracked on Category in build_vignettes.py)
  const visualAidHtml = vignette.visual_aid ? `
          <figure class="visual-aid">
            <img src="${vignette.visual_aid}" alt="Diagram of the mechanism described in the proposal">
            <figcaption>How the research team's proposed mechanism is meant to work, step by step.</figcaption>
          </figure>` : '';

  // The proposal reads [set-up, lead-in ending in ':', quoted mechanism]. The
  // diagram used to sit under the whole block; it now goes directly above the
  // quoted mechanism it illustrates, so it is already on screen while that
  // mechanism is being read. The lead-in stays attached to the quote it
  // introduces, so the figure goes above the lead-in rather than after it.
  // The same block is reused by the Q1 re-reading screen.
  function proposalWithVisualAid(paras) {
    const quoteStart = paras.findIndex(function(p) { return /^["“]/.test(p); });
    if (quoteStart === -1) return renderParagraphs(paras) + visualAidHtml;
    const cut = (quoteStart > 0 && paras[quoteStart - 1].endsWith(':')) ? quoteStart - 1 : quoteStart;
    return renderParagraphs(paras.slice(0, cut)) + visualAidHtml +
           renderParagraphs(paras.slice(cut));
  }
  const proposalHtml = proposalWithVisualAid(vignette.proposal);

  // ===== COMPREHENSION CHECK TRACKING =====
  const comprehensionAttempts = {
    q1_proposal: { attempts: 0, firstCorrect: null, retriggered: false },
    q2_briefing: { attempts: 0, firstCorrect: null, retriggered: false },
    q3_task: { attempts: 0, firstCorrect: null, retriggered: false },
    q4_observation: { attempts: 0, firstCorrect: null, retriggered: false },
    q5_justification: { attempts: 0, firstCorrect: null, retriggered: false }
  };

  // Turn a CSV question into the {value, text} option list the comprehension
  // gate expects. Radio values are positional so option text never has to be
  // escaped into an HTML attribute; the chosen text is recorded separately.
  function buildOptions(question) {
    return question.options.map(function(text, idx) {
      return { value: 'opt' + idx, text: text };
    });
  }

  function correctValue(question, answerText) {
    const idx = question.options.indexOf(answerText);
    if (idx === -1) {
      throw new Error('Vignette ' + vignette.index + ': answer "' + answerText +
                      '" is not among the options');
    }
    return 'opt' + idx;
  }

  // ===== FULLSCREEN ENFORCEMENT =====
  // The jsPsychFullscreen trial below puts the window into fullscreen on a
  // click (browsers only grant it from a user gesture). If the participant
  // leaves fullscreen afterwards - Esc, F11, tabbing away on some browsers -
  // an overlay covers the study until they come back, so the materials are
  // never on screen alongside anything else. Off in test mode so local
  // click-throughs are not fighting the browser chrome.
  const ENFORCE_FULLSCREEN = !TEST_MODE;

  function inFullscreen() {
    return !!(document.fullscreenElement || document.webkitFullscreenElement);
  }

  function requestFullscreen() {
    const el = document.documentElement;
    const fn = el.requestFullscreen || el.webkitRequestFullscreen;
    if (fn) {
      const p = fn.call(el);
      if (p && p.catch) p.catch(function() {});
    }
  }

  if (ENFORCE_FULLSCREEN) {
    const nag = document.getElementById('fullscreen-nag');
    const nagBtn = document.getElementById('fullscreen-nag-btn');
    // Only nag once the study has actually entered fullscreen, so the welcome
    // screen and the fullscreen prompt itself are not covered by the overlay.
    let fullscreenArmed = false;

    nagBtn.addEventListener('click', requestFullscreen);

    const syncNag = function() {
      if (inFullscreen()) {
        fullscreenArmed = true;
        nag.classList.remove('visible');
      } else if (fullscreenArmed) {
        nag.classList.add('visible');
      }
    };

    ['fullscreenchange', 'webkitfullscreenchange'].forEach(function(evt) {
      document.addEventListener(evt, syncNag);
    });
  }

  // Timeline array to hold all trials
  let timeline = [];

  if (TEST_MODE) {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;' +
      'background:#856404;color:#fff;padding:6px 12px;font:13px/1.4 Arial,sans-serif;' +
      'text-align:center;';
    banner.textContent = 'TEST MODE - data will NOT be saved | vignette ' +
      vignette.index + ' (' + vignette.category + ') | ' + complexity + ' / ' + relevance +
      ' | ' + vignette.relev_typ;
    document.body.appendChild(banner);
    document.body.style.paddingTop = '32px';
  }

  // ===== WELCOME / INSTRUCTIONS PAGE =====
  const welcomePage = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="reading-screen">
        <h1 style="text-align: center; margin-bottom: 36px;">Welcome to Our Study</h1>

        <div style="line-height: 1.8; text-align: left;">
          <p>Thank you for participating in this research study!</p>

          <h2 style="margin-top: 34px; margin-bottom: 16px;">What you'll do:</h2>
          <p>In this study, you will:</p>
          <ul style="margin-left: 20px; margin-bottom: 20px; line-height: 2;">
            <li>Read a short scenario about a scientific research project</li>
            <li>Answer some questions about what you read</li>
            <li>Provide your thoughts and opinions</li>
          </ul>

          <h2 style="margin-top: 34px; margin-bottom: 16px;">Time commitment:</h2>
          <p>This study will take approximately <strong>10-15 minutes</strong> to complete.</p>

          <h2 style="margin-top: 34px; margin-bottom: 16px;">Important notes:</h2>
          <ul style="margin-left: 20px; margin-bottom: 20px; line-height: 2;">
            <li>Please read all materials carefully</li>
            <li>There are no right or wrong answers - we're interested in your honest opinions</li>
            <li>Your participation is voluntary and your responses will be kept confidential</li>
            <li>You may withdraw at any time without penalty</li>
          </ul>

          <p style="margin-top: 30px; font-weight: 500;">When you're ready to begin, please click Continue below.</p>
        </div>
      </div>
    `,
    choices: ['Continue'],
    data: {
      task: 'welcome',
      phase: 'intro'
    }
  };
  timeline.push(welcomePage);

  // ===== ENTER FULLSCREEN =====
  if (ENFORCE_FULLSCREEN) {
    timeline.push({
      type: jsPsychFullscreen,
      fullscreen_mode: true,
      message: `
        <div class="reading-screen">
          <h2>Fullscreen mode</h2>
          <p>This study runs in fullscreen mode so that nothing else on your
          screen competes for your attention while you read.</p>
          <p>Clicking the button below will switch your browser to fullscreen.
          Please stay in fullscreen until the study is finished.</p>
        </div>
      `,
      button_label: 'Enter fullscreen and begin',
      data: {
        task: 'enter_fullscreen',
        phase: 'intro'
      }
    });
  }

  // ===== SCREEN 1a: STUDY DESIGN + RELEVANCE + COMPLEXITY =====
  // The two framing manipulations, ending with the complexity briefing. The
  // proposal they are meant to be read against is held back to Screen 1b so
  // this view is not a wall of text.
  const screen1FramingReading = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="reading-screen">
        <h2>About this study</h2>
        ${sceneAidHtml}
        ${renderParagraphs(vignette.study_intro)}

        <div id="task-context">
          ${decisionContextHtml}
        </div>

        ${renderParagraphs(vignette.background)}

        <div class="briefing-card" id="briefing-section">
          ${complexityBriefingHtml}
        </div>
      </div>
    `,
    choices: ['Continue'],
    data: {
      task: 'screen1_framing_reading',
      phase: 'pre'
    }
  };
  timeline.push(screen1FramingReading);

  // ===== COMPREHENSION GATE =====
  // Incorrect answer -> hide the options, highlight the source passage, hold the
  // Continue button disabled for 5 seconds, then re-ask. Loops until correct.
  // Each check is asked directly after the reading view it is drawn from: Q2
  // and Q3 after Screen 1a, Q1 after Screen 1b, Q4 after Screen 2, Q5 after
  // Screen 3.
  function createComprehensionCheck(sectionId, sectionContent, questionText, options, correctAnswer, trackingKey) {
    // Store selected answer in closure
    let selectedAnswer = null;

    const trial = {
      type: jsPsychHtmlButtonResponse,
      stimulus: function() {
        const attempts = comprehensionAttempts[trackingKey].attempts;
        const isRetry = attempts > 0;

        if (isRetry && !comprehensionAttempts[trackingKey].retriggered) {
          // Show re-reading screen with highlighted section
          return `
            <div class="reading-screen">
              <h3 style="color: #856404; margin-bottom: 20px; font-size: 23px;">Please re-read the highlighted section carefully</h3>

              <div class="highlight-reread" id="${sectionId}">
                ${sectionContent}
              </div>

              <p style="margin-top: 20px; font-size: 17px; color: #666;">
                The Continue button will be enabled in <span id="countdown">5</span> seconds...
              </p>
            </div>
          `;
        } else {
          // Show the question
          return `
            <div class="question-section">
              <div class="comprehension-question">
                <label style="font-size: 21px; font-weight: 600; margin-bottom: 20px; display: block;">${questionText}</label>
                <div id="comp-options">
                  ${options.map((opt, idx) => `
                    <div class="comprehension-option">
                      <label style="cursor: pointer; display: flex; align-items: center; padding: 12px; border-radius: 4px; font-weight: 400; transition: background 0.2s;">
                        <input type="radio" name="comp_answer_${trackingKey}" value="${opt.value}" id="opt_${trackingKey}_${idx}">
                        <span>${opt.text}</span>
                      </label>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>
          `;
        }
      },
      choices: function() {
        const attempts = comprehensionAttempts[trackingKey].attempts;
        const isRetry = attempts > 0 && !comprehensionAttempts[trackingKey].retriggered;
        return isRetry ? ['Continue'] : ['Submit'];
      },
      button_html: function() {
        const attempts = comprehensionAttempts[trackingKey].attempts;
        const isRetry = attempts > 0 && !comprehensionAttempts[trackingKey].retriggered;
        if (isRetry) {
          return '<button class="jspsych-btn" id="continue-btn" disabled style="opacity: 0.5;">%choice%</button>';
        } else {
          return '<button class="jspsych-btn" id="submit-btn">%choice%</button>';
        }
      },
      on_load: function() {
        const attempts = comprehensionAttempts[trackingKey].attempts;
        const isRetry = attempts > 0 && !comprehensionAttempts[trackingKey].retriggered;

        if (isRetry) {
          // Countdown timer for re-reading
          let timeLeft = 5;
          const countdownEl = document.getElementById('countdown');
          const continueBtn = document.getElementById('continue-btn');

          const timer = setInterval(() => {
            timeLeft--;
            if (countdownEl) countdownEl.textContent = timeLeft;

            if (timeLeft <= 0) {
              clearInterval(timer);
              if (continueBtn) {
                continueBtn.disabled = false;
                continueBtn.style.opacity = '1';
                continueBtn.style.cursor = 'pointer';
              }
            }
          }, 1000);
        } else {
          // Add event listener to capture answer before submit
          const submitBtn = document.getElementById('submit-btn');
          if (submitBtn) {
            submitBtn.addEventListener('click', function() {
              const selected = document.querySelector('input[name="comp_answer_' + trackingKey + '"]:checked');
              selectedAnswer = selected ? selected.value : null;
            });
          }
        }
      },
      on_finish: function(data) {
        const attempts = comprehensionAttempts[trackingKey].attempts;
        const isRetry = attempts > 0 && !comprehensionAttempts[trackingKey].retriggered;

        if (isRetry) {
          // Just finished re-reading, mark as retriggered
          comprehensionAttempts[trackingKey].retriggered = true;
          data.stage = 'reread_complete';
          data.question = trackingKey;
        } else {
          // Check answer
          comprehensionAttempts[trackingKey].attempts++;
          const isCorrect = selectedAnswer === correctAnswer;

          if (comprehensionAttempts[trackingKey].attempts === 1) {
            comprehensionAttempts[trackingKey].firstCorrect = isCorrect;
          }

          const chosen = options.find(function(o) { return o.value === selectedAnswer; });
          const correctOpt = options.find(function(o) { return o.value === correctAnswer; });

          data.question = trackingKey;
          data.question_text = questionText;
          data.answer = selectedAnswer;
          data.answer_text = chosen ? chosen.text : null;
          data.correct_answer = correctAnswer;
          data.correct_answer_text = correctOpt ? correctOpt.text : null;
          data.correct = isCorrect;
          data.attempt_number = comprehensionAttempts[trackingKey].attempts;
          data.first_attempt_correct = comprehensionAttempts[trackingKey].firstCorrect;
          data.stage = 'answer_submitted';

          // Reset for next attempt if needed
          selectedAnswer = null;
        }
      }
    };

    return trial;
  }

  // Wrap a comprehension check in the retry-until-correct loop.
  function comprehensionLoop(sectionId, sectionContent, question, answerText, trackingKey) {
    return {
      timeline: [
        createComprehensionCheck(
          sectionId,
          sectionContent,
          question.prompt,
          buildOptions(question),
          correctValue(question, answerText),
          trackingKey
        )
      ],
      loop_function: function(data) {
        const lastTrial = data.values()[data.values().length - 1];
        if (lastTrial.stage === 'reread_complete') return true;
        if (lastTrial.stage === 'answer_submitted' && !lastTrial.correct) {
          // Allow the re-reading screen to fire again before the next attempt
          comprehensionAttempts[trackingKey].retriggered = false;
          return true;
        }
        return false;
      }
    };
  }

  const comp = vignette.comprehension;

  // Q2: the complexity briefing (correct answer depends on the complexity condition)
  timeline.push(comprehensionLoop(
    'briefing-section',
    complexityBriefingHtml,
    comp.q2,
    complexity === 'simple' ? comp.q2.answer_simple : comp.q2.answer_complex,
    'q2_briefing'
  ));

  // Q3: the decision context (correct answer depends on the relevance condition)
  timeline.push(comprehensionLoop(
    'task-context',
    decisionContextHtml,
    comp.q3,
    relevance === 'relevant' ? comp.q3.answer_relevant : comp.q3.answer_irrelevant,
    'q3_task'
  ));

  // ===== SCREEN 1b: PRE-STATEMENT (the research team's original proposal) =====
  // Seated after the Screen 1a checks so that every comprehension question
  // sits immediately after the reading view it is drawn from.
  const screen1ProposalReading = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="reading-screen">
        <h2>The Research Team's Proposal</h2>

        <div id="proposal-section">
          ${proposalHtml}
        </div>
      </div>
    `,
    choices: ['Continue'],
    data: {
      task: 'screen1_proposal_reading',
      phase: 'pre'
    }
  };
  timeline.push(screen1ProposalReading);

  // Q1: the proposed mechanism (same correct answer in every condition)
  timeline.push(comprehensionLoop(
    'proposal-section',
    proposalHtml,
    comp.q1,
    comp.q1.answer,
    'q1_proposal'
  ));

  // ===== RATINGS BLOCK BUILDER =====
  // Four perception questions - how complex the system is, and how
  // trustworthy / honest / competent the research team is - each with an
  // optional open-ended justification, each on its own screen. Administered
  // at three measurement points: pre (proposal), anomaly (unexpected field
  // observation), and post (the research team's justification of the anomaly).
  function likertRow(name, anchor) {
    let options = '';
    for (let v = 1; v <= 7; v++) {
      const label = v === 1 ? `1<br>Not at all<br>${anchor}`
                  : v === 4 ? `4<br>Moderately<br>${anchor}`
                  : v === 7 ? `7<br>Extremely<br>${anchor}`
                  : String(v);
      options += `
              <label class="likert-option">
                <input type="radio" name="${name}" value="${v}" required>
                <span class="likert-label">${label}</span>
              </label>`;
    }
    return `<div class="likert-scale">${options}
            </div>`;
  }

  // The two groups the questions fall into. The system-complexity question
  // stands alone; the three research-team questions move as a block. Field
  // names are unchanged from the single-screen version so existing analysis
  // code still finds them.
  const COMPLEXITY_GROUP = [
    {
      field: 'perceived_complexity',
      justification: 'complexity_justification',
      prompt: 'How complex do you perceive the system described in this study to be?',
      anchor: 'complex'
    }
  ];

  const TEAM_GROUP = [
    {
      field: 'team_trustworthiness',
      justification: 'trustworthiness_justification',
      prompt: 'How trustworthy do you think the research team is?',
      anchor: 'trustworthy'
    },
    {
      field: 'team_honesty',
      justification: 'honesty_justification',
      prompt: 'How honest do you think the research team is?',
      anchor: 'honest'
    },
    {
      field: 'team_competence',
      justification: 'competence_justification',
      prompt: 'How competent do you think the research team is?',
      anchor: 'competent'
    }
  ];

  // Draw a presentation order: the two groups are shuffled against each other,
  // and the three team questions are shuffled within their group. Drawn afresh
  // at every measurement point, so no question is ever reliably first, and the
  // realised order is written onto each trial (question_order / position) so it
  // can be checked or controlled for at analysis.
  function perceptionOrder() {
    const groups = jsPsych.randomization.shuffle([
      COMPLEXITY_GROUP,
      jsPsych.randomization.shuffle(TEAM_GROUP)
    ]);
    return [].concat.apply([], groups);
  }

  // Returns an array of trials - one screen per question - so call sites spread
  // it into the timeline.
  function createRatingsBlock(suffix, preamble, finalButtonLabel, phase, taskName) {
    const questions = perceptionOrder();
    const orderLabel = questions.map(function(q) { return q.field; }).join('|');

    return questions.map(function(q, idx) {
      const isLast = idx === questions.length - 1;
      return {
        type: jsPsychSurveyHtmlForm,
        preamble: preamble,
        html: `
        <div class="question-section">
          <div class="question-item">
            <label>${q.prompt}</label>
            ${likertRow(q.field + '_' + suffix, q.anchor)}
            <textarea name="${q.justification}_${suffix}" rows="3" placeholder="Please explain your reasoning (optional)"></textarea>
          </div>
        </div>
      `,
        button_label: isLast ? finalButtonLabel : 'Continue',
        data: {
          task: taskName,
          phase: phase,
          measure: q.field,
          question_position: idx + 1,
          question_order: orderLabel
        }
      };
    });
  }

  // ===== PHASE 1 QUESTIONNAIRES (PRE: after the original proposal) =====
  const screen1_pre_ratings = createRatingsBlock(
    'pre',
    '<div class="study-info wide"><h2>Your Perceptions</h2><p>Please answer the following question based on what you\'ve read so far.</p></div>',
    'Continue',
    'pre',
    'pre_ratings'
  );
  timeline.push(...screen1_pre_ratings);

  // ===== SCREEN 2: ANOMALY EVIDENCE =====
  // The anomalous observation only. The expert's justification is deliberately
  // held back to Screen 3 so ratings can be taken on the bare anomaly.
  const screen2Reading = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="reading-screen" id="screen2-content">
        <h2>New Information</h2>
        ${evidenceAidHtml}

        <div id="observation-section">
          ${anomalyHtml}
        </div>
      </div>
    `,
    choices: ['Continue'],
    data: {
      task: 'screen2_reading',
      phase: 'anomaly'
    }
  };
  timeline.push(screen2Reading);

  // ===== COMPREHENSION CHECK Q4: OBSERVATION =====
  timeline.push(comprehensionLoop(
    'observation-section',
    anomalyHtml,
    comp.q4,
    comp.q4.answer,
    'q4_observation'
  ));

  // ===== PHASE 2 QUESTIONNAIRES (ANOMALY: after the unexplained observation) =====
  const screen2_anomaly_ratings = createRatingsBlock(
    'anomaly',
    '<div class="study-info wide"><h2>What do you think now?</h2><p>Based on all the information you have read so far, please answer the following question again.</p></div>',
    'Continue',
    'anomaly',
    'anomaly_ratings'
  );
  timeline.push(...screen2_anomaly_ratings);

  // ===== SCREEN 3: POST-STATEMENT JUSTIFICATION =====
  const screen3Reading = {
    type: jsPsychHtmlButtonResponse,
    stimulus: `
      <div class="reading-screen" id="screen3-content">
        <h2>Response from the Research Team</h2>

        <div class="context-note">
          <p>The unexpected result was sent back to the same research team that wrote
          the original proposal. Their original account did not predict this result,
          so the team has now added a further explanation on top of it. That added
          explanation is below.</p>
        </div>

        <div id="justification-section">
          ${justificationHtml}
        </div>
      </div>
    `,
    choices: ['Continue'],
    data: {
      task: 'screen3_reading',
      phase: 'post'
    }
  };
  timeline.push(screen3Reading);

  // ===== COMPREHENSION CHECK Q5: THE JUSTIFICATION =====
  // Checks that the team's added explanation landed before the post ratings are
  // taken. Rev_typ is between subjects, so the correct answer comes straight
  // off the vignette row with no condition branch.
  timeline.push(comprehensionLoop(
    'justification-section',
    justificationHtml,
    comp.q5,
    comp.q5.answer,
    'q5_justification'
  ));

  // ===== PHASE 3 QUESTIONNAIRES (POST: after the expert's justification) =====
  const screen3_post_ratings = createRatingsBlock(
    'post',
    '<div class="study-info wide"><h2>What do you think now?</h2><p>Based on all the information you have read, including the explanation the research team added after the unexpected result, please answer the following question again.</p></div>',
    'Submit',
    'post',
    'post_ratings'
  );
  timeline.push(...screen3_post_ratings);


  // Save data to DataPipe -- skipped in test mode so local click-throughs do
  // not write junk rows into the live dataset.
  if (!TEST_MODE) {
    const save_data = {
      type: jsPsychPipe,
      action: "save",
      experiment_id: "uNrh6jZkRoPw",
      filename: filename,
      data_string: () => jsPsych.data.get().csv()
    };
    timeline.push(save_data);
  }

  // Run the experiment
  jsPsych.run(timeline);
</script>
